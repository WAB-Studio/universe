name: CI

on:
  pull_request:
  push:
    branches: [main, integracion]
  # So the browser suite can be driven on demand — to smoke-test the job itself,
  # or to re-run it after a stall in the remote database without an empty commit.
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # PageProps and LayoutProps live in generated, gitignored route types.
      # One app at a time: typegen reads the app's own `app/` directory.
      - run: npx next typegen
        working-directory: apps/orbit
      - run: npx next typegen
        working-directory: apps/voyager
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  # Seconds, over files already in the tree: the dictionary asset is committed,
  # so this needs no build, no browser and no secret. It runs on its own rather
  # than inside `voyager-e2e` because a red here should answer in seconds, not
  # behind a 20-minute suite. It was absent until 2026-09-10, and `D7` sat red
  # on `integracion` for a day with nothing to say so.
  dictionary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:dict -w apps/voyager

  # The pure modules, in milliseconds. `node:test` ships with Node 22, so this
  # job installs nothing the others do not. It exists so a mutation costs
  # seconds instead of the six minutes `voyager-e2e` charges: 33 tests, 255ms
  # measured 2026-09-19 against a suite that could not afford to break its own
  # code on purpose.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:unit -w apps/voyager

  # Drives the policies on `reading` against the real database, DELETE included
  # — the only proof RNL-10 has. One transaction that always rolls back, so it
  # leaves no row and `harness:census` does not move. Also absent until
  # 2026-09-10: the role that makes every policy apply is settled by one shared
  # statement, and nothing in CI watched it.
  policies:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `check:sync` reads `--env-file=.env.local`, not the job environment.
      - name: Write .env.local from the secrets
        working-directory: apps/voyager
        run: |
          missing=""
          for name in DATABASE_URL MIGRATION_DATABASE_URL NEXT_PUBLIC_SUPABASE_URL \
                      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY NEXT_PUBLIC_SITE_URL; do
            [ -n "${!name}" ] || missing="$missing $name"
            printf '%s=%s\n' "$name" "${!name}" >> .env.local
          done
          if [ -n "$missing" ]; then
            echo "::error::missing repository secrets:$missing"
            exit 1
          fi
      - run: npm run check:sync -w apps/voyager

  # The 12-minute suite runs here so a laptop is not holding a dev server and a
  # Chromium for it. One at a time: every run drives the one remote Postgres, and
  # a second concurrent run would contend with it and with a lane running locally.
  # Every path below addresses `apps/orbit`: the suite, its `.env.local`,
  # its route types and its results directory all live there since the monorepo.
  # `apps/voyager` has no database, no identity and no harness, so nothing here
  # touches it — its own browser suite runs without any of this.
  # Which of the two apps a change can actually affect. Orbit's suite is 17
  # minutes and drives the one shared remote Postgres through a single-slot
  # group, so running it for a change it cannot reach costs the whole queue.
  # Measured 2026-09-08: 1043 of the job's 1099 seconds are the suite itself —
  # there is nothing to shave in setup, only runs to not make.
  changes:
    runs-on: ubuntu-latest
    outputs:
      orbit: ${{ steps.filter.outputs.orbit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # `packages/` and the lockfile reach orbit; so does this workflow.
          paths="apps/orbit packages package-lock.json .github/workflows/ci.yml"
          if [ -z "$BASE_SHA" ]; then
            echo "orbit=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --quiet "$BASE_SHA" HEAD -- $paths; then
            echo "orbit=false" >> "$GITHUB_OUTPUT"
          else
            echo "orbit=true" >> "$GITHUB_OUTPUT"
          fi

  # `next build` for orbit runs nowhere else since #57 turned off preview
  # deployments. Without this job the first compile of a merged change happens in
  # the production deployment, and a broken build there hides the next one
  # (docs/TRAPS.md, "One build failure hides the next").
  #
  # `@t3-oss/env-nextjs` validates all six variables at build time and inlines the
  # three public ones, so this job needs the same secrets the suite does — and the
  # same fork guard, because GitHub hands a fork none of them.
  build-orbit:
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       needs.changes.outputs.orbit == 'true')
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Named here, or an empty secret surfaces inside the build as a Zod error on
      # a variable nobody set and reads like the schema broke.
      - name: Name any secret the build needs and does not have
        run: |
          missing=""
          for name in DATABASE_URL MIGRATION_DATABASE_URL NEXT_PUBLIC_SUPABASE_URL \
                      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY NEXT_PUBLIC_SITE_URL CRON_SECRET; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing repository secrets:$missing"
            exit 1
          fi

      # No database is reached: the build compiles and prerenders, and every route
      # that queries is dynamic. It is the compile that has to be proven here.
      - run: npm run build -w apps/orbit

  e2e:
    runs-on: ubuntu-latest
    needs: changes
    # Off until the repository variable E2E_IN_CI is "true". The secrets do not
    # exist until someone puts them there, and without them every step that reads
    # .env.local dies on an empty URL — a red run on every push that says nothing.
    # Turning it on is deliberate, because it also decides which database the
    # suite seeds and purges on every pull request:
    #   gh variable set E2E_IN_CI --body true
    #
    # The second half: the repository is public and GitHub hands no secret to a
    # run triggered from a fork, so those are skipped rather than failed.
    if: >-
      vars.E2E_IN_CI == 'true' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        needs.changes.outputs.orbit == 'true'))
    timeout-minutes: 30
    concurrency:
      group: e2e-remote-db
      cancel-in-progress: false
    env:
      # Its own harness identities and seeded rows, so a CI run never touches the
      # rows a local lane is driving. Lanes 1 to 5 are the checkouts.
      HARNESS_LANE: 9
      HARNESS_BASE_URL: http://localhost:3000
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx next typegen
        working-directory: apps/orbit

      # The scripts read `.env.local` through `--env-file`, which has no fallback
      # to the process environment: without this file every one of them dies.
      # It belongs beside the app that reads it, never at the repository root.
      - name: Write .env.local from the secrets
        working-directory: apps/orbit
        run: |
          missing=""
          for name in DATABASE_URL MIGRATION_DATABASE_URL NEXT_PUBLIC_SUPABASE_URL \
                      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY NEXT_PUBLIC_SITE_URL CRON_SECRET; do
            [ -n "${!name}" ] || missing="$missing $name"
            printf '%s=%s\n' "$name" "${!name}" >> .env.local
          done
          # Named here, or it surfaces three steps later as `Invalid URL` on an
          # empty string and reads like the harness broke.
          if [ -n "$missing" ]; then
            echo "::error::missing repository secrets:$missing"
            exit 1
          fi

      - run: npx playwright install --with-deps chromium

      # Lane 9's two identities and their token rows. Idempotent.
      - run: npm run harness:token -w apps/orbit

      # No step here runs a migration — the database is remote and shared, and
      # whatever schema it carries came from a migration applied out of band.
      # This only reports the weight already on it, so a regression shows up
      # as a number in a diff of two logs (docs/TRAPS.md, "One database, many
      # branches").
      - run: npm run harness:census -w apps/orbit

      - name: Start the dev server and wait for it to answer
        run: |
          npm run dev -w apps/orbit > /tmp/next-dev.log 2>&1 &
          # Curl rather than a `wait-on` install: nothing outside SPEC.md §4 is
          # installed. Dev compiles a route on its first hit, so the wait is for
          # the first page to render, not for the port to open.
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/es; then
              echo "up after ${SECONDS}s"; exit 0
            fi
            sleep 2
          done
          echo "the dev server never answered"; tail -50 /tmp/next-dev.log; exit 1

      - run: npm run check:e2e -w apps/orbit

      # Runs whether check:e2e passed, failed or the job was cancelled — a
      # cancelled or failed run is exactly the one that leaves orphans behind.
      # `--yes` is required (dry-run is the default); the reaper never touches
      # a `shared` identity, so lane 9's own two rows survive every run.
      #
      # A live run elsewhere (another lane driving the same remote database)
      # makes the reaper refuse to start and exit 1 — the concurrency group
      # above keeps that from being *this* job's own next run, but it cannot
      # stop a developer's lane from holding harness.runs at the same moment.
      # That refusal is the interlock working, not a broken build, so it must
      # not turn a green e2e run red. Anything else non-zero — a purge that
      # failed, an unhandled exception — is a real reaper failure and must
      # still fail the job.
      - name: Reap orphaned harness data
        if: always()
        run: |
          set +e
          npm run harness:reap -w apps/orbit -- --yes 2>&1 | tee /tmp/harness-reap.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if grep -q '^BLOCKED' /tmp/harness-reap.log; then
            echo "::warning::harness:reap was blocked by a live run elsewhere; nothing reaped this run"
            exit 0
          fi
          echo "::error::harness:reap failed for a reason other than a live run blocking it"
          exit "$status"

      # The server log is where a red spec is explained — a `57014` there is the
      # remote database stalling, not the code (docs/TRAPS.md).
      - name: Upload the dev server log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: next-dev-log
          path: /tmp/next-dev.log

      - name: Upload the Playwright artefacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-results
          path: apps/orbit/private/playwright-results-9/

  # `apps/voyager`'s own browser suite. It ran nowhere until 2026-09-08, and
  # that is how two seeded specs sat red on `main` unnoticed: they opened
  # `reading-log` pinned at version 1 after module 6 raised the store to 2.
  #
  # Deliberately NOT in the `e2e-remote-db` group. This app has no database, no
  # identity and no harness, so it contends with nothing — putting it in that
  # one-slot queue would only make the queue evict more (docs/TRAPS.md, "Every
  # push enters the one-slot group").
  voyager-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The build validates these through `lib/env.ts`, where module 8 made all
      # five required. The suite itself reaches none of them: the word path is
      # IndexedDB and the sync copy is never turned on in a spec.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      VOYAGER_BASE_URL: http://localhost:3100
      # Arms `app/layout.tsx`'s test hook for this job's own build alone.
      # `apps/voyager/vercel.json` names no such variable, so a Vercel build
      # never sets it and never inlines the branch it guards.
      VOYAGER_E2E_HOOKS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx next typegen
        working-directory: apps/voyager

      - name: Write .env.local from the secrets
        working-directory: apps/voyager
        run: |
          missing=""
          for name in DATABASE_URL MIGRATION_DATABASE_URL NEXT_PUBLIC_SUPABASE_URL \
                      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY NEXT_PUBLIC_SITE_URL; do
            [ -n "${!name}" ] || missing="$missing $name"
            printf '%s=%s\n' "$name" "${!name}" >> .env.local
          done
          # Named here, or it surfaces later as `Invalid URL` on an empty string
          # and reads like the suite broke.
          if [ -n "$missing" ]; then
            echo "::error::missing repository secrets:$missing"
            exit 1
          fi

      - run: npx playwright install --with-deps chromium

      # Production, not dev: the config says so, and module 22's counting
      # assertions need the single effect run production gives
      # (docs/TRAPS.md, "StrictMode doubles a Worker count").
      - run: npm run build -w apps/voyager

      # `--port` explicitly: the `start` script is a bare `next start`, which
      # defaults to 3000 — only `dev` carries `--port ${PORT:-3100}`. Without
      # this the server comes up on the wrong port and the wait below times out
      # against a healthy app.
      - name: Start the app and wait for it to answer
        run: |
          npm run start -w apps/voyager -- --port 3100 > /tmp/voyager.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3100/; then
              echo "up after ${SECONDS}s"; exit 0
            fi
            sleep 2
          done
          echo "the server never answered"; tail -50 /tmp/voyager.log; exit 1

      - run: npm run check:e2e -w apps/voyager

      - name: Upload the server log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: voyager-log
          path: /tmp/voyager.log

      - name: Upload the Playwright artefacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: voyager-playwright-results
          path: apps/voyager/private/playwright-results
